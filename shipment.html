<!DOCTYPE html>
<html>
<head>
    <title>Shipment Management Form</title>

    <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <h3 class="text-center">Shipment Management Form</h3>

    <form id="shipmentForm">

        <div class="mb-2">
            <label>Shipment No</label>
            <input type="text" id="shipNo" class="form-control">
        </div>

        <div class="mb-2">
            <label>Description</label>
            <input type="text" id="description" class="form-control">
        </div>

        <div class="mb-2">
            <label>Source</label>
            <input type="text" id="source" class="form-control">
        </div>

        <div class="mb-2">
            <label>Destination</label>
            <input type="text" id="destination" class="form-control">
        </div>

        <div class="mb-2">
            <label>Shipping Date</label>
            <input type="date" id="shippingDate" class="form-control">
        </div>

        <div class="mb-2">
            <label>Expected Delivery Date</label>
            <input type="date" id="deliveryDate" class="form-control">
        </div>

        <div class="text-center mt-3">

            <button type="button" id="save" class="btn btn-success" disabled>Save</button>
            <button type="button" id="update" class="btn btn-warning" disabled>Update</button>
            <button type="button" id="reset" class="btn btn-danger" disabled>Reset</button>

        </div>

    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>

<script src="shipment.js"></script>

</body>
</html>
